version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - npx prisma generate
    build:
      commands:
        - 'echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" >> .env.production'
        - 'echo "NEXTAUTH_URL=$NEXTAUTH_URL" >> .env.production'
        - 'echo "DATABASE_URL=$DATABASE_URL" >> .env.production'
        - 'echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> .env.production'
        - 'echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> .env.production'
        - 'echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY" >> .env.production'
        - 'echo "AWS_ACCESS_KEY_ID=$AMPLIFY_AWS_ACCESS_KEY_ID" >> .env.production'
        - 'echo "AWS_SECRET_ACCESS_KEY=$AMPLIFY_AWS_SECRET_ACCESS_KEY" >> .env.production'
        - 'echo "CUSTOM_AWS_REGION=$AMPLIFY_AWS_REGION" >> .env.production'
        - 'echo "AWS_S3_BUCKET_NAME=$AMPLIFY_AWS_S3_BUCKET_NAME" >> .env.production'
        - 'echo "Build-time AMPLIFY_AWS_REGION is $AMPLIFY_AWS_REGION"'
        - 'grep CUSTOM_AWS_REGION .env.production || echo "WARNING not set"'
        - 'echo "POSTMARK_SERVER_TOKEN=$POSTMARK_SERVER_TOKEN" >> .env.production'
        - 'echo "POSTMARK_ADMIN_EMAIL=$POSTMARK_ADMIN_EMAIL" >> .env.production'
        - 'echo "POSTMARK_SUPPORT_EMAIL=$POSTMARK_SUPPORT_EMAIL" >> .env.production'
        - 'echo "CASE_NOTIFICATION_EMAIL=$CASE_NOTIFICATION_EMAIL" >> .env.production'
        - 'echo "ACCOUNT_NOTIFICATION_EMAIL=$ACCOUNT_NOTIFICATION_EMAIL" >> .env.production'
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
