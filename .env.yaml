# Firebase Cloud Run Environment Variables (YAML format)
# This file is used by Firebase to configure Cloud Run
# Deploy with: firebase deploy --only hosting:dashboard

# IMPORTANT: Use this for non-sensitive configuration only
# For secrets, use Google Secret Manager

# Database Configuration (use Secret Manager for passwords)
DATABASE_URL: "postgresql://postgres.wghvermnyvppsgshgbmu:PASSWORD@aws-0-ap-south-1.pooler.supabase.com:5432/postgres?pgbouncer=true&connection_limit=1"
DIRECT_URL: "postgresql://postgres.wghvermnyvppsgshgbmu:PASSWORD@aws-0-ap-south-1.pooler.supabase.com:6543/postgres"

# Supabase Configuration
NEXT_PUBLIC_SUPABASE_URL: "https://wghvermnyvppsgshgbmu.supabase.co"
# SUPABASE_SERVICE_ROLE_KEY: Use Secret Manager

# NextAuth Configuration
NEXTAUTH_URL: "https://dashboard.quantyxg.com"
# NEXTAUTH_SECRET: Use Secret Manager

# AWS Configuration (use Secret Manager for keys)
AWS_REGION: "ap-south-2"
AWS_S3_BUCKET_NAME: "quantyx-global"

# Email Configuration (use Secret Manager for token)
POSTMARK_ADMIN_EMAIL: "admin@quantyxg.com"
POSTMARK_ADMIN_NAME: "Quantyx Global Admin"
POSTMARK_SUPPORT_EMAIL: "support@quantyxg.com"
POSTMARK_SUPPORT_NAME: "Quantyx Global Support"
POSTMARK_NOREPLY_EMAIL: "noreply@quantyxg.com"
POSTMARK_NOREPLY_NAME: "Quantyx Global System"

# Notification Recipients
CASE_NOTIFICATION_EMAIL: "info@quantyxg.com"
ACCOUNT_NOTIFICATION_EMAIL: "support@quantyxg.com"
FROM_EMAIL: "support@quantyxg.com"
FROM_NAME: "Quantyx Global Support"

# Feature Flags
NEXT_PUBLIC_ENABLE_MFA: "true"
NEXT_PUBLIC_ENABLE_AUDIT_LOGS: "true"
NEXT_PUBLIC_ENABLE_FILE_ENCRYPTION: "true"

# Domain Configuration
NEXT_PUBLIC_DOMAIN: "dashboard.quantyxg.com"
NEXT_PUBLIC_WEBSITE_URL: "https://quantyxg.com"

# Google Cloud Project
GOOGLE_CLOUD_PROJECT: "quantyx-global"
